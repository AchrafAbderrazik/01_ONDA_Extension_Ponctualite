[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aeroops"
version = "1.0.0"
description = "Module Ponctualité & Prédiction des retards — projet personnel sur données publiques (nycflights13 / US BTS 2013). Non affilié à l'ONDA."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT (code) — données CC0 (nycflights13)" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "joblib>=1.3",
    "matplotlib>=3.7",
    "flask>=3.0",
    "flask-cors>=4.0",
    "PyJWT>=2.8",
    "SQLAlchemy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
aeroops-etl = "aeroops.etl:main"
aeroops-train = "aeroops.train:main"
aeroops-anomalies = "aeroops.anomalies:main"
aeroops-api = "aeroops.api.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aeroops = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning:sklearn.*",
]
